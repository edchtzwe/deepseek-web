name: tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop, main]
  workflow_dispatch:

# A new push supersedes the previous run on the same ref.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Show interpreter
        run: python -VV

      - name: Test suite
        run: python -m pytest tests/ -q

      - name: CLI smoke test
        # The package must import and answer without a key; doctor is offline.
        run: |
          set +e
          deepseek-web doctor --format json > /tmp/doctor.json
          code=$?
          set -e
          cat /tmp/doctor.json
          test "$code" -eq 0
          python -c "import json,sys; d=json.load(open('/tmp/doctor.json')); assert 'ready' in d, d"
